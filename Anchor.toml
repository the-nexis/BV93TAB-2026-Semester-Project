[toolchain]
anchor_version = "1.2.1"
solana_version = "4.1.2"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
freelance_escrow = "uiTZySgzCQVi1z8TaQcSgmcn5rVcqb7jXp7dS4sgYie"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/freelance-escrow-localnet.json"

[workspace]
members = ["programs/freelance_escrow"]
idls = "packages/protocol-client/src/generated/idl"
types = "packages/protocol-client/src/generated/types"

[scripts]
test = "yarn test:program"

