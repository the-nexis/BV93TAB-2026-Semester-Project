[package]
name = "freelance_escrow"
version = "0.1.0"
description = "Permissionless freelance milestone escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "freelance_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
